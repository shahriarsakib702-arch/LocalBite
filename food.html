
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCALBITE | Food Menu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #FFF8E7;
      color: #1F1F1F;
    }

    header {
      background: #0F3D2E;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #FF8A3D;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 55px 15px 35px;
    }

    .hero small {
      color: #FF8A3D;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero h1 {
      color: #0F3D2E;
      font-size: 34px;
      margin: 12px 0;
    }

    .hero p {
      color: #777;
      font-size: 15px;
    }

    .menu {
      max-width: 1100px;
      margin: auto;
      padding: 20px 6% 65px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .food-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 22px #00000010;
      transition: 0.3s;
    }

    .food-card:hover {
      transform: translateY(-5px);
    }

    .food-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .details {
      padding: 18px;
    }

    .details h2 {
      font-size: 19px;
      color: #0F3D2E;
      margin-bottom: 12px;
    }

    .price {
      color: #FF8A3D;
      font-size: 21px;
      font-weight: bold;
    }

    footer {
      background: #0F3D2E;
      color: white;
      text-align: center;
      padding: 22px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .menu {
        gap: 13px;
        padding-left: 4%;
        padding-right: 4%;
      }

      .food-card img {
        height: 145px;
      }

      .details {
        padding: 12px;
      }

      .details h2 {
        font-size: 15px;
      }

      .price {
        font-size: 18px;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
        /* Add to Cart Button */
    .add-to-cart {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: #0F3D2E;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-to-cart:hover {
      background: #FF8A3D;
    }

    /* Shopping Cart */
    #cart-box {
      max-width: 900px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
    }

    #cart-box h2 {
      color: #0F3D2E;
      margin-bottom: 18px;
      font-size: 25px;
    }

    #cart-items p {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }

    #cart-box h3 {
      color: #0F3D2E;
      margin-top: 18px;
      font-size: 21px;
      text-align: right;
    }

    @media (max-width: 600px) {
      #cart-box {
        margin: 20px 4%;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">LOCAL<span>BITE</span></div>
    <a class="back" href="index.html">← Back to Home</a>
  </header>

  <section class="hero">
    <small>FRESH & DELICIOUS</small>
    <h1>Explore Our Food</h1>
    <p>Delicious food, right around you.</p>
  </section>

  <section class="menu">

    <div class="food-card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=700" alt="Chicken Burger">
      <div class="details">
        <h2>Chicken Burger</h2>
        <div class="price">৳80</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>

    <div class="food-card">
  <img src="Chicken-Shawarma-8.jpg" alt="Chicken Shawarma">
  <div class="details">
    <h2>Chicken Shawarma</h2>
    <div class="price">৳70</div>
    <button class="add-to-cart">Add to Cart</button>
  </div>
</div>

    <div class="food-card">
      <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=700" alt="French Fries">
      <div class="details">
        <h2>French Fries</h2>
        <div class="price">৳50</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>

    <div class="food-card">
  <img src="file_000000008ef88208b786978bcae69c1d.png" alt="Chicken Roll">
  <div class="details">
    <h2>Chicken Roll</h2>
    <div class="price">৳40</div>
    <button class="add-to-cart">Add to Cart</button>
  </div>
</div>
    
  </section>

  <footer>
    © 2026 LOCALBITE. Good Food. Right Around You.
  </footer>
<div id="cart-box">
  <h2>🛒 Your Cart</h2>
  <div id="cart-items"></div>
  <h3>Total: ৳<span id="cart-total">0</span></h3>
</div>
  <script>
let cart = [];

document.querySelectorAll(".add-to-cart").forEach((button, index) => {
  button.addEventListener("click", function () {
    const card = button.closest(".food-card");
    const name = card.querySelector("h2").innerText;
    const price = Number(card.querySelector(".price").innerText.replace("৳", ""));

    cart.push({ name, price });
    updateCart();
  });
});

function updateCart() {
  const cartItems = document.getElementById("cart-items");
  const cartTotal = document.getElementById("cart-total");

  cartItems.innerHTML = "";
  let total = 0;

  cart.forEach(item => {
    total += item.price;
    cartItems.innerHTML += `<p>${item.name} — ৳${item.price}</p>`;
  });

  cartTotal.innerText = total;
}
</script>
</body>
</html>
