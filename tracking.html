<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCALBITE | Order Tracking</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #FFF8E7;
  color: #0F3D2E;
  padding: 20px;
}

.tracking-container {
  max-width: 450px;
  margin: 40px auto;
  background: white;
  padding: 25px 20px;
  border-radius: 20px;
  box-shadow: 0 8px 30px #00000012;
}

h2 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

.order-id {
  background: #F1F6F2;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 25px;
}

.status {
  font-weight: bold;
  color: #FF8A3D;
}

</style>
</head>

<body>

<div class="tracking-container">

  <h2>Track Your Order</h2>

  <p class="subtitle">
    Your LOCALBITE order journey
  </p>

  <div class="order-id">
    <p>ORDER ID</p>
    <h3 id="tracking-order-id">Loading...</h3>
  </div>

  <div id="tracking-status">
    <p class="status">Checking Order Status...</p>
  </div>
<div id="order-details" style="margin-top:20px;"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://gjbfcnwbzbossaqywobq.supabase.co",
  "sb_publishable_3-6l5wzu43fEC6JalqzhPg_m_31oBQf"
);
</script>
  
<script>
async function loadOrderTracking() {
  const detailsBox = document.getElementById("order-details");
if (detailsBox) detailsBox.textContent = "";
localStorage.removeItem("localbiteActiveOrders");
  const savedOrders = JSON.parse(
    localStorage.getItem("localbiteActiveOrders") || "[]"
  );

  const activeOrders = savedOrders.filter(
    order => order && typeof order === "object"
      && order.order_code && order.tracking_token
  );

  if (activeOrders.length === 0) {
    document.getElementById("tracking-order-id").textContent =
      "No Active Order";

    document.getElementById("tracking-status").textContent =
      "No active order found.";

    return;
  }

  const order = activeOrders[activeOrders.length - 1];

  document.getElementById("tracking-order-id").textContent =
    order.order_code;

  const { data, error } = await supabaseClient.rpc(
    "get_order_tracking",
    {
      p_order_code: order.order_code,
      p_tracking_token: order.tracking_token
    }
  );

  if (error || !data) {
    document.getElementById("tracking-status").textContent =
      "Unable to load order status. Please try again.";

    return;
  }

  document.getElementById("tracking-status").textContent =
    "Order Status: " + data.order_status;
const details = document.getElementById("order-details");

const items = Array.isArray(data.order_items)
  ? data.order_items
  : [];

details.style.whiteSpace = "pre-line";

details.textContent =
  "ORDER DETAILS\n\n" +
  items.map(item =>
    item.name + " × " + item.quantity +
    " = ৳" + (item.price * item.quantity)
  ).join("\n") +
  "\n\nDelivery Charge: ৳" + data.delivery_charge +
  "\nTotal Amount: ৳" + data.total_amount +
  "\nPayment: " + data.payment_method;
}

loadOrderTracking();
</script>

</body>
</html>
