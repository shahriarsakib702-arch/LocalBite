
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCALBITE | Grocery Store</title>

<style>
:root {
  --green: #0F3D2E;
  --orange: #FF8A3D;
  --cream: #FFF8E7;
  --dark: #1F1F1F;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: var(--cream);
  color: var(--dark);
}

header {
  background: var(--green);
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: var(--orange);
}

header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.hero {
  background: var(--green);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 12px;
}

.hero p {
  color: #e7eee9;
}

.search-box {
  max-width: 600px;
  margin: 25px auto;
  padding: 0 15px;
}

.search-box input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

.section {
  padding: 30px 6% 100px;
}

.section h2 {
  color: var(--green);
  margin-bottom: 8px;
  font-size: 26px;
}

.section-subtitle {
  color: #666;
  margin-bottom: 25px;
}

.grocery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 18px;
}

.grocery-card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.grocery-card img {
  width: 100%;
  height: 145px;
  object-fit: cover;
}

.grocery-info {
  padding: 13px;
}

.grocery-info h3 {
  font-size: 17px;
  margin-bottom: 8px;
}

.grocery-price {
  color: var(--green);
  font-weight: bold;
  margin-bottom: 12px;
}

.grocery-add-btn {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 9px;
  background: var(--green);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.grocery-add-btn:active {
  transform: scale(0.97);
  background: var(--orange);
}

footer {
  background: var(--green);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

footer p {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 1px;
}

/* Cart Button */
.cart-button {
  position: fixed;
  right: 18px;
  bottom: 20px;
  z-index: 1000;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 30px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  cursor: pointer;
}

/* Cart Overlay */
.cart-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1001;
}

.cart-overlay.active {
  display: block;
}

/* Cart Panel */
.cart-panel {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 420px;
  height: 100%;
  background: white;
  z-index: 1002;
  padding: 22px;
  overflow-y: auto;
  transition: 0.3s;
}

.cart-panel.active {
  right: 0;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.cart-header h2 {
  color: var(--green);
}

.close-cart {
  border: none;
  background: none;
  font-size: 28px;
  cursor: pointer;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.cart-item-info {
  flex: 1;
}

.cart-item-info strong {
  display: block;
  margin-bottom: 7px;
}

.quantity-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}

.quantity-controls button {
  width: 27px;
  height: 27px;
  border: none;
  border-radius: 6px;
  background: var(--cream);
  color: var(--green);
  font-size: 18px;
  cursor: pointer;
}

.remove-item {
  border: none;
  background: none;
  color: #d33;
  cursor: pointer;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  font-size: 19px;
  font-weight: bold;
  color: var(--green);
  margin: 22px 0;
}

.cart-action {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 9px;
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.checkout-btn {
  background: var(--green);
  color: white;
}

.clear-btn {
  background: #fff1eb;
  color: #d44;
}

/* Order Form */
.order-form {
  display: none;
  margin-top: 20px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.order-form.active {
  display: block;
}

.order-form h3 {
  color: var(--green);
  margin-bottom: 15px;
}

.order-form input,
.order-form textarea {
  width: 100%;
  padding: 13px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

.location-btn {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid var(--green);
  border-radius: 8px;
  background: white;
  color: var(--green);
  font-weight: bold;
  cursor: pointer;
}

.place-order-btn {
  background: var(--orange);
  color: white;
}

@media (max-width: 480px) {
  .hero h1 {
    font-size: 27px;
  }

  .section {
    padding-left: 15px;
    padding-right: 15px;
  }

  .grocery-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .grocery-card img {
    height: 125px;
  }
}
  .cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cart-item-image {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 10px;
  flex-shrink: 0;
}
  /* Checkout Floating Popup */
.order-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 2000;
}

.order-overlay.active {
  display: block;
}

.order-form {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 30px);
  max-width: 420px;
  max-height: 85vh;
  overflow-y: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  z-index: 2001;
  margin: 0;
}

.order-form.active {
  display: block;
}
</style>
</head>

<body>

<header>
  <div class="logo">LOCAL<span>BITE.</span></div>
  <a href="index.html">← Back to Home</a>
</header>

<section class="hero">
  <h1>Fresh Groceries Near You</h1>
  <p>Your Daily Essentials, Delivered to You.</p>
</section>

<div class="search-box">
  <input type="text" id="grocery-search" placeholder="Search groceries...">
</div>

<section class="section">
  <h2>Daily Grocery</h2>
  <p class="section-subtitle">Everyday essentials at your doorstep.</p>
  <div class="grocery-grid" id="grocery-list"></div>
</section>

<footer>
  <div class="logo">LOCAL<span>BITE.</span></div>
  <p>GOOD FOOD. RIGHT AROUND YOU.</p>
</footer>

<button class="cart-button" onclick="toggleCart()">
  🛒 Cart (<span id="cart-count">0</span>)
</button>

<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
<div class="order-overlay" id="order-overlay"
     onclick="closeOrderForm()"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-header">
    <h2>Your Cart 🛒</h2>
    <button class="close-cart" onclick="toggleCart()">×</button>
  </div>

  <div id="cart-items"></div>

  <div class="cart-total">
    <span>Total</span>
    <span id="cart-total">৳0</span>
  </div>

  <button class="cart-action checkout-btn" onclick="checkout()">
    Proceed to Checkout →
  </button>

  <button class="cart-action clear-btn" onclick="clearCart()">
    🗑️ Clear Cart
  </button>

  <div class="order-form" id="order-form">
    <h3>Complete Your Order</h3>

    <input type="text" id="customer-name" placeholder="Your Name">
    <input type="tel" id="customer-phone" placeholder="Phone Number">
    <textarea id="customer-address" rows="3" placeholder="Full Delivery Address"></textarea>

    <button class="location-btn" onclick="getCurrentLocation()">
      📍 Share My Location (Optional)
    </button>

    <p id="location-status" style="font-size:13px;margin-bottom:12px;color:#555;"></p>

    <button class="cart-action place-order-btn" onclick="placeOrder()">
      Place Order on WhatsApp
    </button>
  </div>
</div>

<script>
const groceryProducts = [
  {
    name: "চাল (মোটা)",
    price: 50,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"
  },
  {
    name: "আলু",
    price: 22,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500"
  },
  {
    name: "পেঁয়াজ",
    price: 55,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1508747703725-719777637510?w=500"
  },
  {
    name: "ডিম",
    price: 42,
    unit: "৪টি",
    image: "https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?w=500"
  },
  {
    name: "মসুর ডাল",
    price: 90,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1515543904379-3d757afe72e4?w=500"
  },
  {
    name: "টমেটো",
    price: 110,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=500"
  },
  {
    name: "রসুন",
    price: 160,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1540148426945-6cf22a6b2383?w=500"
  },
  {
    name: "কাঁচা মরিচ",
    price: 80,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1588252303782-cb80119abd6d?w=500"
  },
  {
    name: "বেগুন",
    price: 60,
    unit: "কেজি",
    image: "cropped-freepik__upload__86592.png"
  },
  {
    name: "গাজর",
    price: 100,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1445282768818-728615cc910a?w=500"
  },
  {
    name: "আটা",
    price: 50,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1627485937980-221c88ac04f9?w=500"
  },
  {
    name: "চিনি",
    price: 110,
    unit: "কেজি",
    image: "world-diabetes-day-sugar-wooden-bowl-dark-surface_1150-26666.jpg"
  }
];

let cart = JSON.parse(localStorage.getItem("localbiteCart")) || [];
let customerLocation = "";

function saveCart() {
  localStorage.setItem("localbiteCart", JSON.stringify(cart));
  updateCart();
}

function displayGroceries(products) {
  const groceryList = document.getElementById("grocery-list");

  if (products.length === 0) {
    groceryList.innerHTML = "<p>No Products Found.</p>";
    return;
  }

  groceryList.innerHTML = products.map(product => `
    <div class="grocery-card">
      <img src="${product.image}" alt="${product.name}"
        onerror="this.src='https://placehold.co/500x350?text=Grocery'">
      <div class="grocery-info">
        <h3>${product.name}</h3>
        <p class="grocery-price">৳${product.price} / ${product.unit}</p>
        <button class="grocery-add-btn"
          onclick="addGroceryToCart('${product.name}')">
          + Add to Cart
        </button>
      </div>
    </div>
  `).join("");
}

function addGroceryToCart(productName) {
  const product = groceryProducts.find(item => item.name === productName);
  if (!product) return;

  const existingItem = cart.find(item => item.name === product.name);

  if (existingItem) {
    existingItem.quantity += 1;
  } else {
cart.push({
  name: product.name,
  price: product.price,
  quantity: 1,
  image: product.image
});
  }

  saveCart();
}

function updateCart() {
  const cartItems = document.getElementById("cart-items");
  const cartCount = document.getElementById("cart-count");
  const cartTotal = document.getElementById("cart-total");

  let total = 0;
  let count = 0;

  if (cart.length === 0) {
    cartItems.innerHTML = "<p>Your cart is empty!</p>";
  } else {
    cartItems.innerHTML = cart.map((item, index) => {
      total += item.price * item.quantity;
      count += item.quantity;

      return `
  <div class="cart-item">
    <img src="${item.image || (groceryProducts.find(p => p.name === item.name) || {}).image || 'https://placehold.co/100x100?text=Grocery'}"
     alt="${item.name}"
     class="cart-item-image">

    <div class="cart-item-info">
            <strong>${item.name}</strong>
            <span>৳${item.price} × ${item.quantity}</span>
            <div class="quantity-controls">
              <button onclick="changeQuantity(${index}, -1)">−</button>
              <span>${item.quantity}</span>
              <button onclick="changeQuantity(${index}, 1)">+</button>
            </div>
          </div>
          <button class="remove-item" onclick="removeItem(${index})">
            Remove
          </button>
        </div>
      `;
    }).join("");
  }

  cartCount.textContent = count;
  cartTotal.textContent = "৳" + total;
}

function changeQuantity(index, amount) {
  if (!cart[index]) return;

  cart[index].quantity += amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  saveCart();
}

function toggleCart() {
  document.getElementById("cart-panel").classList.toggle("active");
  document.getElementById("cart-overlay").classList.toggle("active");
}

function clearCart() {
  if (cart.length === 0) {
    alert("Your cart is already empty!");
    return;
  }

  if (!confirm("Are you sure you want to clear your cart?")) return;

  cart = [];
  saveCart();
  updateCart();

  document.getElementById("order-form").classList.remove("active");
  document.getElementById("cart-panel").classList.remove("active");
  document.getElementById("cart-overlay").classList.remove("active");
}
function checkout() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  document.getElementById("order-form").classList.add("active");
}

function getCurrentLocation() {
  const status = document.getElementById("location-status");

  if (!navigator.geolocation) {
    status.textContent = "Location is not supported by your browser.";
    return;
  }

  status.textContent = "Getting your location...";

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      customerLocation = `https://www.google.com/maps?q=${lat},${lon}`;
      status.textContent = "Location added successfully.";
    },
    () => {
      status.textContent = "Location unavailable. You can still order using your address.";
    }
  );
}

function placeOrder() {
  const name = document.getElementById("customer-name").value.trim();
  const phone = document.getElementById("customer-phone").value.trim();
  const address = document.getElementById("customer-address").value.trim();

  if (!name || !phone || !address) {
    alert("Please fill in your name, phone number and address.");
    return;
  }

  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  let total = 0;
  let orderText = "🛒 *LOCALBITE GROCERY ORDER*\n\n";

  orderText += `Name: ${name}\n`;
  orderText += `Phone: ${phone}\n`;
  orderText += `Address: ${address}\n\n`;
  orderText += "*Order Items:*\n";

  cart.forEach(item => {
    const subtotal = item.price * item.quantity;
    total += subtotal;

    orderText += `${item.name} × ${item.quantity} = ৳${subtotal}\n`;
  });

  orderText += `\n*Total: ৳${total}*\n`;

  if (customerLocation) {
    orderText += `\nCustomer Location: ${customerLocation}\n`;
  }

  orderText += "\nThank you for ordering from LOCALBITE!";

  const whatsappURL =
    "https://wa.me/8801632033787?text=" + encodeURIComponent(orderText);

  window.open(whatsappURL, "_blank");

  cart = [];
  saveCart();

  document.getElementById("customer-name").value = "";
  document.getElementById("customer-phone").value = "";
  document.getElementById("customer-address").value = "";
  document.getElementById("location-status").textContent = "";

  customerLocation = "";

  document.getElementById("order-form").classList.remove("active");
  document.getElementById("cart-panel").classList.remove("active");
  document.getElementById("cart-overlay").classList.remove("active");
}

document.getElementById("grocery-search").addEventListener("input", function() {
  const searchValue = this.value.toLowerCase();

  const filteredProducts = groceryProducts.filter(product =>
    product.name.toLowerCase().includes(searchValue)
  );

  displayGroceries(filteredProducts);
});

window.addEventListener("load", function() {
  updateCart();
});

displayGroceries(groceryProducts);
updateCart();
</script>

</body>
</html>
