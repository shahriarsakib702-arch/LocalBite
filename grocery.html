
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groceries | LOCALBITE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #FFF8E7;
  color: #1F1F1F;
}

header {
  background: #0F3D2E;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: #FF8A3D;
}

header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.hero {
  padding: 55px 6%;
  text-align: center;
  background: #0F3D2E;
  color: white;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 12px;
}

.hero p {
  color: #e5e5e5;
}

.container {
  padding: 35px 6%;
  max-width: 1100px;
  margin: auto;
}

.container h2 {
  color: #0F3D2E;
  margin-bottom: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 15px;
  margin-bottom: 25px;
}

.empty-message {
  text-align: center;
  padding: 35px;
  color: #777;
  background: white;
  border-radius: 15px;
}

footer {
  background: #0F3D2E;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 50px;
}

@media (max-width: 600px) {
  .hero h1 {
    font-size: 27px;
  }
}
  .grocery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 25px;
}

.grocery-card {
  background: white;
  border-radius: 15px;
  padding: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.grocery-card img {
  width: 100%;
  height: 125px;
  object-fit: cover;
  border-radius: 10px;
}

.grocery-card h3 {
  color: #0F3D2E;
  font-size: 15px;
  margin: 10px 0 5px;
}

.grocery-card .price {
  color: #FF8A3D;
  font-weight: bold;
}

@media (max-width: 360px) {
  .grocery-grid {
    gap: 10px;
  }
}
  .grocery-add-btn {
  width: 100%;
  padding: 11px;
  margin-top: 12px;
  background: #0F3D2E;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.grocery-add-btn:active {
  transform: scale(0.97);
  background: #FF8A3D;
}
</style>
</head>

<body>

<header>
  <div class="logo">LOCAL<span>BITE.</span></div>
  <a href="index.html">← Home</a>
</header>

<section class="hero">
  <h1>Fresh Groceries 🥬</h1>
  <p>Everyday essentials, right around you.</p>
</section>

<main class="container">
  <h2>Explore Groceries 🛒</h2>
  <p>Daily essentials at affordable prices.</p>

  <input
    type="search"
    id="grocery-search"
    class="search"
    placeholder="Search groceries..."
  >

  <div id="grocery-grid" class="grocery-grid">
    <p>Loading groceries...</p>
  </div>
</main>

<footer>
  <div class="logo">LOCAL<span>BITE.</span></div>
  <p>GOOD FOOD. RIGHT AROUND YOU.</p>
</footer>
<script>
const groceryProducts = [
  {
    name: "চাল (মোটা)",
    price: 50,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"
  },
  {
    name: "আলু",
    price: 22,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500"
  },
  {
    name: "পেঁয়াজ",
    price: 55,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1508747703725-719777637510?w=500"
  },
  {
    name: "ডিম",
    price: 42,
    unit: "৪টি",
    image: "https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?w=500"
  },
  {
    name: "মসুর ডাল",
    price: 90,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1515543904379-3d757afe72e4?w=500"
  },
  {
    name: "টমেটো",
    price: 110,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=500"
  },
    {
    name: "রসুন",
    price: 160,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1540148426945-6cf22a6b2383?w=500"
  },
  {
    name: "কাঁচা মরিচ",
    price: 80,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1588252303782-cb80119abd6d?w=500"
  },
  {
    name: "বেগুন",
    price: 60,
    unit: "কেজি",
    image: "cropped-freepik__upload__86592.png"
  },
  {
    name: "গাজর",
    price: 100,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1445282768818-728615cc910a?w=500"
  },
  {
    name: "আটা",
    price: 50,
    unit: "কেজি",
    image: "https://images.unsplash.com/photo-1627485937980-221c88ac04f9?w=500"
  },
  {
    name: "চিনি",
    price: 110,
    unit: "কেজি",
    image: "world-diabetes-day-sugar-wooden-bowl-dark-surface_1150-26666.jpg"
  }
];

const groceryGrid = document.getElementById("grocery-grid");
function addGroceryToCart(productName) {
  let cart = JSON.parse(localStorage.getItem("localbiteCart")) || [];

  const product = groceryProducts.find(
    item => item.name === productName
  );

  if (!product) return;

  const existing = cart.find(
    item => item.name === product.name
  );

  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      name: product.name,
      price: product.price,
      quantity: 1,
      image: product.image
    });
  }

  localStorage.setItem("localbiteCart", JSON.stringify(cart));

  alert(product.name + " added to your cart!");
}
function displayGroceries(products) {
  groceryGrid.innerHTML = "";

  if (products.length === 0) {
    groceryGrid.innerHTML = "<p>কোনো পণ্য পাওয়া যায়নি।</p>";
    return;
  }

  products.forEach((product, index) => {
    groceryGrid.innerHTML += `
      <div class="grocery-card">
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p class="price">৳${product.price} / ${product.unit}</p>

        <button onclick='addGroceryToCart("${product.name}")'
          class="grocery-add-btn">
          + Add to Cart
        </button>
      </div>
    `;
  });
}

displayGroceries(groceryProducts);

document.getElementById("grocery-search").addEventListener("input", function() {
  const searchText = this.value.toLowerCase();

  const filteredProducts = groceryProducts.filter(product =>
    product.name.toLowerCase().includes(searchText)
  );

  displayGroceries(filteredProducts);
});
</script>
</body>
</html>
